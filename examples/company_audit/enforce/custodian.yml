policies:
- name: clo-pol-shared-gcp-bucket
  resource: gcp.bucket
  comment: CLO policy pol_shared, scope organization
  filters:
  - or:
    - labels."cost-center": absent
    - labels."data-classification": absent
    - labels."environment": absent
    - labels."owner": absent
  actions:
  - type: notify
    to:
    - resource-owner
    template: default
    transport:
      type: pubsub
      topic: projects/example/topics/clo
